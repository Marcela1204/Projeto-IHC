<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1936" viewBox="0 0 1120 1936" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
<rect width="1120" height="1936" fill="#ffffff"/>
<text x="560" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2328">Entrega 14 — Fluxo da avaliação de usabilidade por observação</text>
<text x="560" y="70" text-anchor="middle" font-size="13" fill="#57606a">Planejamento → recrutamento → consentimento → preparação → observação → pós-teste → consolidação → recomendações</text>
<rect x="20" y="92" width="1080" height="542" rx="12" fill="#eef4fb" stroke="#1f60c4" stroke-opacity="0.35"/>
<text x="36" y="116" font-size="13" font-weight="bold" fill="#1f60c4" letter-spacing="1">PREPARAÇÃO</text>
<rect x="20" y="654" width="1080" height="578" rx="12" fill="#eef8f1" stroke="#1a7f37" stroke-opacity="0.35"/>
<text x="36" y="678" font-size="13" font-weight="bold" fill="#1a7f37" letter-spacing="1">COLETA DE DADOS</text>
<rect x="20" y="1252" width="1080" height="240" rx="12" fill="#fdf6e7" stroke="#9a6700" stroke-opacity="0.35"/>
<text x="36" y="1276" font-size="13" font-weight="bold" fill="#9a6700" letter-spacing="1">INTERPRETAÇÃO E CONSOLIDAÇÃO</text>
<rect x="20" y="1512" width="1080" height="382" rx="12" fill="#f5f0fb" stroke="#6e40c9" stroke-opacity="0.35"/>
<text x="36" y="1536" font-size="13" font-weight="bold" fill="#6e40c9" letter-spacing="1">RELATO E RECOMENDAÇÕES</text>
<rect x="310.0" y="136" width="500" height="85" rx="8" fill="#ffffff" stroke="#1f60c4" stroke-width="1.6"/>
<rect x="318.0" y="142" width="24" height="24" rx="12" fill="#1f60c4"/>
<text x="330.0" y="158" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">1</text>
<text x="350.0" y="159" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Planejamento</text>
<text x="350.0" y="178" text-anchor="start" font-size="12" fill="#57606a">Metas da Entrega 08 (MU01–MU08, MU10–MU12, MQ01–MQ08)</text>
<text x="350.0" y="195" text-anchor="start" font-size="12" fill="#57606a">Perguntas QA01–QA14 da Entrega 12</text>
<text x="350.0" y="212" text-anchor="start" font-size="12" fill="#57606a">Tarefas UT01–UT07, gabarito e critérios de sucesso (B, passo 5)</text>
<path d="M560 221 L560 253" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="310.0" y="255" width="500" height="68" rx="8" fill="#ffffff" stroke="#1f60c4" stroke-width="1.6"/>
<rect x="318.0" y="261" width="24" height="24" rx="12" fill="#1f60c4"/>
<text x="330.0" y="277" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">2</text>
<text x="350.0" y="278" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Recrutamento</text>
<text x="350.0" y="297" text-anchor="start" font-size="12" fill="#57606a">Triagem de 2 participantes (1 por perfil: P01 e P02)</text>
<text x="350.0" y="314" text-anchor="start" font-size="12" fill="#57606a">pelos critérios de inclusão e exclusão do passo 2</text>
<rect x="850.0" y="255.0" width="200" height="68" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-dasharray="4 3"/>
<text x="950.0" y="277.0" text-anchor="middle" font-size="12" fill="#1f2328" font-weight="bold">proxy?</text>
<text x="950.0" y="295.0" text-anchor="middle" font-size="12" fill="#57606a">registrar a condição</text>
<text x="950.0" y="311.0" text-anchor="middle" font-size="12" fill="#57606a">e tratar como limitação</text>
<path d="M810.0 289.0 L848.0 289.0" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<path d="M560 323 L560 355" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="310.0" y="357" width="500" height="68" rx="8" fill="#ffffff" stroke="#1f60c4" stroke-width="1.6"/>
<rect x="318.0" y="363" width="24" height="24" rx="12" fill="#1f60c4"/>
<text x="330.0" y="379" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">3</text>
<text x="350.0" y="380" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Preparação do material</text>
<text x="350.0" y="399" text-anchor="start" font-size="12" fill="#57606a">Protótipo F01/F02 com recorte congelado (checagem de prontidão)</text>
<text x="350.0" y="416" text-anchor="start" font-size="12" fill="#57606a">TCLE, pré-teste, cartões de tarefa, planilha, SEQ, SUS, roteiro pós-teste</text>
<path d="M560 425 L560 457" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="310.0" y="459" width="500" height="51" rx="8" fill="#ffffff" stroke="#1f60c4" stroke-width="1.6"/>
<rect x="318.0" y="465" width="24" height="24" rx="12" fill="#1f60c4"/>
<text x="330.0" y="481" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">4</text>
<text x="350.0" y="482" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Teste piloto</text>
<text x="350.0" y="501" text-anchor="start" font-size="12" fill="#57606a">1 sessão por roteiro (P01 e P02), fora da amostra final</text>
<path d="M560 510 L560 542" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<polygon points="560,544 690.0,576.0 560,608 430.0,576.0" fill="#ffffff" stroke="#1f60c4" stroke-width="1.6"/>
<text x="560" y="581.0" text-anchor="middle" font-size="13" fill="#1f2328" font-weight="bold">Ajustes necessários?</text>
<path d="M690 576.0 L870.0 576.0 L870.0 391.0 L812.0 391.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="878.0" y="568.0" text-anchor="start" font-size="12" fill="#1f2328" font-weight="bold">sim</text>
<text x="878.0" y="470.5" text-anchor="start" font-size="12" fill="#57606a">revisar instruções,</text>
<text x="878.0" y="486.5" text-anchor="start" font-size="12" fill="#57606a">tempos-limite e protótipo</text>
<text x="570" y="626" text-anchor="start" font-size="12" fill="#1f2328" font-weight="bold">não</text>
<path d="M560 616 L560 670" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1080" y="678" text-anchor="end" font-size="12" fill="#1a7f37" font-weight="bold">U01 antes de U02 · ~50 min por sessão · sala virtual</text>
<rect x="310.0" y="698" width="500" height="51" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
<rect x="318.0" y="704" width="24" height="24" rx="12" fill="#1a7f37"/>
<text x="330.0" y="720" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">5</text>
<text x="350.0" y="721" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Abertura padronizada</text>
<text x="350.0" y="740" text-anchor="start" font-size="12" fill="#57606a">Avalia-se o protótipo, não a pessoa; dados de laboratório e ações simuladas</text>
<path d="M560 749 L560 781" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="310.0" y="783" width="500" height="51" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
<rect x="318.0" y="789" width="24" height="24" rx="12" fill="#1a7f37"/>
<text x="330.0" y="805" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">6</text>
<text x="350.0" y="806" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Consentimento (TCLE)</text>
<text x="350.0" y="825" text-anchor="start" font-size="12" fill="#57606a">Leitura do termo adaptado (B, passo 3)</text>
<path d="M560 834 L560 866" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<polygon points="560,868 690.0,900.0 560,932 430.0,900.0" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
<text x="560" y="905.0" text-anchor="middle" font-size="13" fill="#1f2328" font-weight="bold">Aceita?</text>
<rect x="70.0" y="874.0" width="200" height="52" rx="26" fill="#ffffff" stroke="#cf222e" stroke-width="1.6"/>
<text x="170.0" y="896.0" text-anchor="middle" font-size="13" fill="#1f2328" font-weight="bold">Encerra a sessão</text>
<text x="170.0" y="914.0" text-anchor="middle" font-size="12" fill="#57606a">nada é registrado</text>
<path d="M430 900.0 L272.0 900.0" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="420" y="892.0" text-anchor="end" font-size="12" fill="#1f2328" font-weight="bold">não</text>
<text x="570" y="950" text-anchor="start" font-size="12" fill="#1f2328" font-weight="bold">sim → liga a gravação, se autorizada</text>
<path d="M560 932 L560 966" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="310.0" y="968" width="500" height="51" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
<rect x="318.0" y="974" width="24" height="24" rx="12" fill="#1a7f37"/>
<text x="330.0" y="990" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">7</text>
<text x="350.0" y="991" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Pré-teste</text>
<text x="350.0" y="1010" text-anchor="start" font-size="12" fill="#57606a">Perfil mínimo: área, experiência, uso de SIEM/IDS, métricas, condição de proxy</text>
<path d="M560 1019 L560 1051" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="310.0" y="1053" width="500" height="68" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
<rect x="318.0" y="1059" width="24" height="24" rx="12" fill="#1a7f37"/>
<text x="330.0" y="1075" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">8</text>
<text x="350.0" y="1076" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Tarefas com observação (sem think aloud contínuo)</text>
<text x="350.0" y="1095" text-anchor="start" font-size="12" fill="#57606a">Por tarefa: cartão → execução → planilha → SEQ</text>
<text x="350.0" y="1112" text-anchor="start" font-size="12" fill="#57606a">UT02: interrupção provocada de 60 s (protocolo MU10)</text>
<path d="M810.0 1107 L850.0 1107 L850.0 1067 L812.0 1067" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="858.0" y="1091.0" text-anchor="start" font-size="12" fill="#57606a">próxima tarefa</text>
<path d="M560 1121 L560 1153" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="310.0" y="1155" width="500" height="51" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6"/>
<rect x="318.0" y="1161" width="44" height="24" rx="12" fill="#1a7f37"/>
<text x="340.0" y="1177" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">9–11</text>
<text x="370.0" y="1178" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">SUS → Entrevista pós-teste → Encerramento</text>
<text x="370.0" y="1197" text-anchor="start" font-size="12" fill="#57606a">Salvar arquivos com o ID; em U01, guardar o registro de UT02 para UT07</text>
<path d="M810.0 1180.5 L960.0 1180.5 L960.0 723.5 L812.0 723.5" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="968.0" y="926.5" text-anchor="start" font-size="12" fill="#57606a">próxima</text>
<text x="968.0" y="942.5" text-anchor="start" font-size="12" fill="#57606a">sessão (U02)</text>
<path d="M560 1214 L560 1268" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="310.0" y="1296" width="500" height="68" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="1.6"/>
<rect x="318.0" y="1302" width="24" height="24" rx="12" fill="#9a6700"/>
<text x="330.0" y="1318" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">12</text>
<text x="350.0" y="1319" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Revisão das gravações e das duas planilhas</text>
<text x="350.0" y="1338" text-anchor="start" font-size="12" fill="#57606a">Moderador + observador; divergências resolvidas pela gravação</text>
<text x="350.0" y="1355" text-anchor="start" font-size="12" fill="#57606a">Codificação de erros (EI, EN, ER, EG, ET) e de falas</text>
<path d="M560 1364 L560 1396" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="310.0" y="1398" width="500" height="68" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="1.6"/>
<rect x="318.0" y="1404" width="24" height="24" rx="12" fill="#9a6700"/>
<text x="330.0" y="1420" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">13</text>
<text x="350.0" y="1421" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Consolidação</text>
<text x="350.0" y="1440" text-anchor="start" font-size="12" fill="#57606a">Por participante (seção C) e por tarefa (seção D)</text>
<text x="350.0" y="1457" text-anchor="start" font-size="12" fill="#57606a">Comparação indicativa com as metas da Entrega 08</text>
<path d="M560 1474 L560 1528" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="310.0" y="1556" width="500" height="68" rx="8" fill="#ffffff" stroke="#6e40c9" stroke-width="1.6"/>
<rect x="318.0" y="1562" width="24" height="24" rx="12" fill="#6e40c9"/>
<text x="330.0" y="1578" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">14</text>
<text x="350.0" y="1579" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Problemas e achados</text>
<text x="350.0" y="1598" text-anchor="start" font-size="12" fill="#57606a">Problemas PU01, PU02… → achados AU com severidade 0–4</text>
<text x="350.0" y="1615" text-anchor="start" font-size="12" fill="#57606a">→ recomendações e artefatos a revisar (seção E)</text>
<path d="M560 1624 L560 1656" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="310.0" y="1658" width="500" height="51" rx="8" fill="#ffffff" stroke="#6e40c9" stroke-width="1.6"/>
<rect x="318.0" y="1664" width="24" height="24" rx="12" fill="#6e40c9"/>
<text x="330.0" y="1680" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">15</text>
<text x="350.0" y="1681" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Comparação e conclusão</text>
<text x="350.0" y="1700" text-anchor="start" font-size="12" fill="#57606a">Comparação com a avaliação heurística (seção F) → conclusão (seção G)</text>
<path d="M560 1709 L560 1741" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="310.0" y="1743" width="500" height="51" rx="8" fill="#ffffff" stroke="#6e40c9" stroke-width="1.6"/>
<rect x="318.0" y="1749" width="24" height="24" rx="12" fill="#6e40c9"/>
<text x="330.0" y="1765" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">16</text>
<text x="350.0" y="1766" text-anchor="start" font-size="14" fill="#1f2328" font-weight="bold">Atualização da rastreabilidade</text>
<text x="350.0" y="1785" text-anchor="start" font-size="12" fill="#57606a">Entregas 01, 05, 06, 08–11 e RASTREABILIDADE.md</text>
<path d="M560 1794 L560 1826" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="470" y="1828" width="180" height="40" rx="20" fill="#6e40c9"/>
<text x="560" y="1853" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">Fim</text>
<path d="M40 1906 L90 1906" stroke="#374151" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="98" y="1910" font-size="12" fill="#57606a">fluxo principal</text>
<path d="M210 1906 L260 1906" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="268" y="1910" font-size="12" fill="#57606a">condição ou repetição</text>
<text x="1080" y="1910" text-anchor="end" font-size="12" fill="#57606a">Projeto IHC · Equipe 21 · seção B do documento 14</text>
