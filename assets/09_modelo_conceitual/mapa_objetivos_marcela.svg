<text x="88" y="328.0" text-anchor="middle" font-size="10" fill="#6b7280">O12</text>
<text x="126" y="310.0" font-size="14" fill="#111827">trocar o algoritmo</text>
<text x="126" y="328.0" font-size="14" fill="#111827">(ou voltar ao anterior)</text>
