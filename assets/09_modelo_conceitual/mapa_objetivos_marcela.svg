<rect width="1040" height="700" fill="#ffffff"/>
<text x="520.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Mapa de objetivos individual — Marcela Nalesso (CI02, papel V)</text>
