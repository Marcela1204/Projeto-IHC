<text x="574" y="502" text-anchor="start" font-size="12.5" fill="#b45309" font-style="italic">fora deste mapa — papel do analista:</text>
<text x="574" y="519" text-anchor="start" font-size="12.5" fill="#b45309">a troca muda o que o analista vê e precisa ser avisada</text>
