<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Mapa de objetivos consolidado — Entrega 09</text>

  <!-- conectores raiz -> objetivos principais -->
  <g stroke="#6b7280" stroke-width="2" fill="none">
    <path d="M600 102 V122 H220 V140"/>
    <path d="M600 122 H980 V140"/>
    <!-- espinha P01 -->
    <path d="M55 196 V573"/>
    <path d="M55 253 H70"/><path d="M55 313 H70"/><path d="M55 373 H70"/>
    <path d="M55 433 H70"/><path d="M55 493 H70"/><path d="M55 553 H70"/>
    <!-- espinha P02 -->
    <path d="M1145 196 V433"/>
    <path d="M1145 253 H1130"/><path d="M1145 313 H1130"/><path d="M1145 373 H1130"/><path d="M1145 433 H1130"/>
  </g>
  <!-- conectores para objetivos compartilhados -->
  <g stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <path d="M400 168 H418 V353 H435"/><path d="M418 413 H435"/><path d="M418 473 H435"/>
    <path d="M418 353 V473"/>
    <path d="M800 168 H782 V353 H765"/><path d="M782 413 H765"/><path d="M782 473 H765"/>
    <path d="M782 353 V473"/>
  </g>

  <!-- raiz -->
  <rect x="380" y="50" width="440" height="52" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="600" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Tratar intrusões na rede com apoio do IDS</text>

  <!-- objetivo principal P01 -->
  <rect x="40" y="140" width="360" height="56" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="220" y="163" text-anchor="middle" font-size="13" fill="#1e3a8a">Thiago (P01) — CI01</text>
  <text x="220" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Decidir se o alerta é incidente e encaminhar</text>

  <!-- objetivo principal P02 -->
  <rect x="800" y="140" width="360" height="56" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="980" y="163" text-anchor="middle" font-size="13" fill="#7c2d12">Vanessa (P02) — CI02</text>
  <text x="980" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">Manter o modelo adequado ao ambiente</text>

  <!-- objetivos P01 -->
  <g font-size="13" fill="#1e3a8a">
    <rect x="70" y="230" width="330" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="84" y="258">O01 Perceber se há algo fora do padrão  ▲</text>
    <rect x="70" y="290" width="330" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="84" y="318">O02 Recortar período e origem de interesse  ▲</text>
    <rect x="70" y="350" width="330" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="84" y="378">O03 Interpretar o alerta e sua incerteza  ▲</text>
    <rect x="70" y="410" width="330" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="84" y="438">O05 Registrar o veredito com justificativa  ▲</text>
    <rect x="70" y="470" width="330" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="84" y="498">O06 Encaminhar o caso e passar o plantão</text>
    <rect x="70" y="530" width="330" height="46" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="84" y="558">O07 Retomar investigação interrompida</text>
  </g>

  <!-- objetivos compartilhados -->
  <text x="600" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">Compartilhados (P01 e P02)</text>
  <g font-size="13" fill="#111827">
    <rect x="435" y="330" width="330" height="46" rx="6" fill="#f3f4f6" stroke="#374151"/>
    <text x="449" y="358">O04 Saber qual modelo está ativo e desde quando ▲</text>
    <rect x="435" y="390" width="330" height="46" rx="6" fill="#f3f4f6" stroke="#374151"/>
    <text x="449" y="418">O08 Acompanhar alertas não confirmados</text>
    <rect x="435" y="450" width="330" height="46" rx="6" fill="#f3f4f6" stroke="#374151"/>
    <text x="449" y="478">O13 Consultar o histórico de trocas</text>
  </g>

  <!-- objetivos P02 -->
  <g font-size="13" fill="#7c2d12">
    <rect x="800" y="230" width="330" height="46" rx="6" fill="#fff7ed" stroke="#c2410c"/>
    <text x="814" y="258">O09 Verificar a saúde do pipeline</text>
    <rect x="800" y="290" width="330" height="46" rx="6" fill="#fff7ed" stroke="#c2410c"/>
    <text x="814" y="318">O10 Comparar candidato e modelo em produção  ▲</text>
    <rect x="800" y="350" width="330" height="46" rx="6" fill="#fff7ed" stroke="#c2410c"/>
    <text x="814" y="378">O11 Prever o efeito da troca para os analistas  ▲</text>
    <rect x="800" y="410" width="330" height="46" rx="6" fill="#fff7ed" stroke="#c2410c"/>
    <text x="814" y="438">O12 Promover ou reverter o modelo</text>
  </g>

  <!-- fluxo de coordenação -->
  <g font-size="12" fill="#374151">
    <text x="600" y="530" text-anchor="middle">O05 (veredito “benigno”) alimenta O08 · O12 (troca de modelo) atualiza O04</text>
  </g>

  <!-- legenda -->
  <g font-size="12" fill="#374151">
    <rect x="40" y="606" width="18" height="14" fill="#eff6ff" stroke="#1d4ed8"/><text x="64" y="618">Investigação — P01</text>
    <rect x="220" y="606" width="18" height="14" fill="#fff7ed" stroke="#c2410c"/><text x="244" y="618">Configuração/validação — P02</text>
    <rect x="460" y="606" width="18" height="14" fill="#f3f4f6" stroke="#374151"/><text x="484" y="618">Compartilhado</text>
    <path d="M610 613 H650" stroke="#6b7280" stroke-width="2"/><text x="658" y="618">subobjetivo</text>
    <path d="M750 613 H790" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="798" y="618">usado pelos dois perfis</text>
    <text x="960" y="618">▲ prioridade alta</text>
  </g>
</svg>
