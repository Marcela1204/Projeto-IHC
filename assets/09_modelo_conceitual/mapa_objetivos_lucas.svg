<text x="88" y="382.0" text-anchor="middle" font-size="10" fill="#6b7280">O05</text>
<text x="126" y="364.0" font-size="14" fill="#111827">registrar a decisão</text>
<text x="126" y="382.0" font-size="14" fill="#111827">(ataque / falso positivo / indefinido)</text>
<rect x="60" y="410" width="440" height="44" rx="9" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
