<text x="588" y="451.0" text-anchor="middle" font-size="13" fill="#111827">T</text>
<text x="588" y="466.0" text-anchor="middle" font-size="10" fill="#6b7280">O06</text>
<text x="626" y="457.0" font-size="14" fill="#111827">passar o plantão</text>
<path d="M560 452 H500" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ah)" stroke-dasharray="6 4"/>
<rect x="560" y="505" width="440" height="62" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="574" y="527" text-anchor="start" font-size="12.5" fill="#b45309" font-style="italic">fora deste mapa — papel da administradora:</text>
<text x="574" y="547" text-anchor="start" font-size="12.5" fill="#b45309">as decisões “falso positivo” viram o sinal de que</text>
<text x="574" y="563" text-anchor="start" font-size="12.5" fill="#b45309">o classificador pode não estar adequado</text>
