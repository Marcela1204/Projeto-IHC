<text x="588" y="221.0" text-anchor="middle" font-size="13" fill="#111827">T</text>
<text x="588" y="236.0" text-anchor="middle" font-size="10" fill="#6b7280">O02</text>
<text x="626" y="227.0" font-size="14" fill="#111827">congelar os dados</text>
