<text x="88" y="77.0" text-anchor="middle" font-size="13" fill="#111827">T</text>
<text x="88" y="92.0" text-anchor="middle" font-size="10" fill="#6b7280">final</text>
<text x="126" y="83.0" font-size="15" fill="#111827" font-weight="bold">decidir se há incidente e encaminhar o caso</text>
<rect x="60" y="130" width="440" height="44" rx="9" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<line x1="116" y1="130" x2="116" y2="174" stroke="#111827" stroke-width="1.2"/>
<text x="88" y="151.0" text-anchor="middle" font-size="13" fill="#111827">T</text>
<text x="88" y="166.0" text-anchor="middle" font-size="10" fill="#6b7280">O01</text>
<text x="126" y="157.0" font-size="14" fill="#111827">perceber se há algo fora do padrão</text>
<rect x="60" y="200" width="440" height="44" rx="9" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<line x1="116" y1="200" x2="116" y2="244" stroke="#111827" stroke-width="1.2"/>
<text x="88" y="221.0" text-anchor="middle" font-size="13" fill="#111827">T</text>
<text x="88" y="236.0" text-anchor="middle" font-size="10" fill="#6b7280">O02</text>
<text x="126" y="227.0" font-size="14" fill="#111827">recortar período e origem de interesse</text>
<rect x="60" y="270" width="440" height="44" rx="9" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<line x1="116" y1="270" x2="116" y2="314" stroke="#111827" stroke-width="1.2"/>
<text x="88" y="291.0" text-anchor="middle" font-size="13" fill="#111827">T</text>
<text x="88" y="306.0" text-anchor="middle" font-size="10" fill="#6b7280">O03</text>
<text x="126" y="297.0" font-size="14" fill="#111827">interpretar o alerta e sua incerteza</text>
<rect x="60" y="340" width="440" height="56" rx="9" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<line x1="116" y1="340" x2="116" y2="396" stroke="#111827" stroke-width="1.2"/>
