<text x="646" y="318" font-size="14" fill="#1f2328" font-weight="bold">Por que virou alerta</text>
<text x="646" y="342" font-size="13" fill="#1f2328">Histórico origem–destino: esta origem não tinha se comunicado</text>
<text x="646" y="362" font-size="13" fill="#1f2328">com este destino nos últimos 7 dias.</text>
<text x="646" y="382" font-size="13" fill="#1f2328">Quão incomum: o volume é mais incomum que 99% do tráfego</text>
<text x="646" y="402" font-size="13" fill="#1f2328">habitual deste destino.</text>
<text x="646" y="422" font-size="13" fill="#1f2328">Motivo do sinal: volume de bytes muito acima do habitual</text>
<text x="646" y="442" font-size="13" fill="#1f2328">para este destino.</text>
<text x="646" y="470" font-size="13" fill="#1f60c4">▸ Ver regra completa do detector</text>
