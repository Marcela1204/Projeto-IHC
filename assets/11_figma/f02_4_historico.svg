<text x="32" y="608" font-size="13" fill="#1f2328" font-weight="bold">Registro (somente leitura) — não há edição nem exclusão de entradas do histórico.</text>
<text x="32" y="632" font-size="13" fill="#1f2328">Cada linha: data/hora, tipo (promoção ou reversão), modelo anterior e novo, autor, motivo e o sinal dos analistas antes e depois.</text>
