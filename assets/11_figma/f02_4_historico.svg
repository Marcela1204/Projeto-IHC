<text x="636" y="450" font-size="13" fill="#1f2328">30/10 14:10 · promoção · SVM v7 → SVM v8 · Vanessa</text>
<text x="636" y="472" font-size="13" fill="#1f2328">Motivo: Reduzir alertas falsos no tráfego benigno…</text>
<text x="636" y="502" font-size="12" fill="#57606a">Sem botão “Voltar ao v7…”: trocar o modelo é ação da</text>
<text x="636" y="520" font-size="12" fill="#57606a">administração; o analista consulta o que mudou e quando.</text>
<circle cx="1180" cy="422" r="11" fill="#6f42c1" stroke="#ffffff" stroke-width="2"/>
