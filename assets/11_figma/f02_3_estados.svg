<text x="44" y="466" font-size="13" fill="#6e3f00" font-weight="bold">Reprovado no cenário benigno: marcou 21,5% do tráfego benigno como ataque (fpr 0,215); o máximo é 5% (0,05).</text>
<text x="44" y="486" font-size="13" fill="#6e3f00">Este candidato não pode ser colocado em produção. Os demais cenários estão abaixo, para diagnóstico.</text>
