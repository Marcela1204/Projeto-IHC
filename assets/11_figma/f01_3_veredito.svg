<text x="430.0" y="294.5" font-size="13" fill="#32383f" font-weight="bold" text-anchor="middle">indefinido</text>
<text x="36" y="326" font-size="12" fill="#57606a">Nenhuma opção vem marcada por padrão (aqui Thiago já escolheu “ataque”). Mesmos nomes da classificação.</text>
<circle cx="740" cy="240" r="11" fill="#6f42c1" stroke="#ffffff" stroke-width="2"/>
<text x="740" y="244.5" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<rect x="20" y="350" width="720" height="108" rx="4" fill="#fff8e1" stroke="#b26a00" stroke-width="2"/>
<text x="36" y="374" font-size="13" fill="#6e3f00" font-weight="bold">⚠ 2 destes 312 alertas têm incerteza alta (a classificação está perto de mudar).</text>
<text x="36" y="396" font-size="13" fill="#6e3f00">Quer incluí-los como ataque mesmo assim ou marcá-los como indefinidos?</text>
<rect x="36" y="410" width="250" height="32" rx="4" fill="#1f60c4" stroke="#1f60c4" stroke-width="1"/>
<text x="161.0" y="431.0" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">Marcar os 2 como indefinidos</text>
<rect x="296" y="410" width="236" height="32" rx="4" fill="#ffffff" stroke="#8c959f" stroke-width="1"/>
<text x="414.0" y="431.0" font-size="13" fill="#1f2328" text-anchor="middle">Incluir como ataque mesmo assim</text>
<text x="548" y="432" font-size="13" fill="#1f60c4">Ver os 2 alertas ›</text>
<circle cx="740" cy="350" r="11" fill="#6f42c1" stroke="#ffffff" stroke-width="2"/>
<text x="740" y="354.5" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<rect x="20" y="470" width="720" height="150" rx="4" fill="#ffffff" stroke="#c4cad1" stroke-width="1"/>
<text x="36" y="494" font-size="14" fill="#1f2328" font-weight="bold">Justificativa (obrigatória) — é o que o próximo turno e a infraestrutura vão ler</text>
<rect x="36" y="506" width="688" height="98" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="1"/>
<text x="46" y="526" font-size="13" fill="#1f2328">Dados consultados: 10.0.4.0/24 → portal interno, web TCP/443, 19:00–21:00;</text>
<text x="46" y="545" font-size="13" fill="#1f2328">origem sem histórico com o destino em 7 dias; volume &gt; 99% do habitual.</text>
<text x="46" y="564" font-size="13" fill="#1f2328">Base da decisão: varredura seguida de volume anormal contra o portal, origem</text>
<text x="46" y="583" font-size="13" fill="#1f2328">sem histórico com esse destino.|</text>
<circle cx="740" cy="470" r="11" fill="#6f42c1" stroke="#ffffff" stroke-width="2"/>
<text x="740" y="474.5" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="20" y="646" font-size="13" fill="#57606a" font-weight="bold">Estado F01.3E — tentativa de registrar sem justificativa:</text>
<rect x="20" y="654" width="720" height="64" rx="4" fill="#ffebe9" stroke="#c62828" stroke-width="2"/>
<text x="36" y="678" font-size="13" fill="#8f1a1a" font-weight="bold">✕ Diga em uma frase com base em quê decidiu.</text>
<text x="36" y="700" font-size="13" fill="#8f1a1a">A justificativa é o que o próximo turno vai ler. O que você escreveu nos outros campos foi mantido.</text>
<circle cx="740" cy="654" r="11" fill="#6f42c1" stroke="#ffffff" stroke-width="2"/>
<text x="740" y="658.5" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text>
<rect x="760" y="132" width="420" height="426" rx="4" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
<text x="776" y="158" font-size="15" fill="#1f2328" font-weight="bold">Resumo do que será registrado</text>
<text x="776" y="176" font-size="12" fill="#57606a">(atualizado após “Marcar os 2 como indefinidos”)</text>
<text x="776" y="202" font-size="13" fill="#1f2328">• 310 alertas como ataque</text>
<text x="776" y="226" font-size="13" fill="#1f2328">• 2 alertas como indefinido (incerteza alta)</text>
<text x="776" y="250" font-size="13" fill="#1f2328">• origem 10.0.4.0/24</text>
