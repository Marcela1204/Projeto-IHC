<text x="776" y="298" font-size="13" fill="#1f2328">• período 19:00–21:00</text>
<text x="776" y="322" font-size="13" fill="#1f2328">• autor: Thiago (sessão atual)</text>
<text x="776" y="346" font-size="13" fill="#1f2328">• horário: ao confirmar</text>
<text x="776" y="384" font-size="12" fill="#57606a">Os vereditos “benigno” passam a compor o</text>
<text x="776" y="400" font-size="12" fill="#57606a">indicador “alertas não confirmados” visto pela</text>
<text x="776" y="416" font-size="12" fill="#57606a">administração do modelo (D05).</text>
<rect x="776" y="438" width="388" height="38" rx="4" fill="#1f60c4" stroke="#1f60c4" stroke-width="1"/>
