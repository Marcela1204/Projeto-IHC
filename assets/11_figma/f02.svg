<text x="44" y="436" font-size="13" fill="#1b5e20" font-weight="bold">Cenário decisivo: benigno — a fração do tráfego benigno marcada como ataque (fpr) cai de 0,21 para 0,04; o máximo exigido é 0,05.</text>
