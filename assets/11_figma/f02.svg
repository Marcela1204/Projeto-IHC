<text x="170" y="572" font-size="12" fill="#57606a">fração dos ataques capturados; menor = ataques passam</text>
<text x="560" y="554" font-size="13" fill="#57606a">‹v›</text>
<text x="680" y="554" font-size="13" fill="#57606a">‹v›</text>
<text x="800" y="554" font-size="13" fill="#1f2328">mín. ‹v›</text>
<text x="880" y="554" font-size="13" fill="#6e3f00">pior: 2 ataques do teste</text>
<text x="1030" y="554" font-size="13" fill="#1b5e20">✓ atende</text>
<line x1="33" y1="580" x2="1167" y2="580" stroke="#eaeef2" stroke-width="1"/>
<text x="44" y="600" font-size="13" fill="#1f2328">agregado</text>
<text x="170" y="600" font-size="13" fill="#1f2328" font-weight="bold">precisão ⓘ</text>
<text x="170" y="618" font-size="12" fill="#57606a">dos alertas emitidos, quantos são ataque de fato</text>
<text x="560" y="600" font-size="13" fill="#57606a">‹v›</text>
<text x="680" y="600" font-size="13" fill="#57606a">‹v›</text>
<text x="800" y="600" font-size="13" fill="#1f2328">mín. ‹v›</text>
<text x="880" y="600" font-size="13" fill="#1f2328">‹v›</text>
<text x="1030" y="600" font-size="13" fill="#1b5e20">✓ atende</text>
<line x1="33" y1="626" x2="1167" y2="626" stroke="#eaeef2" stroke-width="1"/>
<text x="44" y="646" font-size="12" fill="#57606a">‹v› = valor lido do portão de promoção do pipeline; o wireframe só fixa os números citados em CI02.</text>
<text x="44" y="664" font-size="12" fill="#57606a">ⓘ em cada métrica abre a explicação de uma frase; a mesma explicação aparece em D01/D02.</text>
