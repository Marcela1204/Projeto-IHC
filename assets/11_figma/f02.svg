<text x="680" y="479" font-size="13" fill="#1f2328" font-weight="bold">Candidato v8</text>
<text x="800" y="479" font-size="13" fill="#1f2328" font-weight="bold">Exigido</text>
<text x="880" y="479" font-size="13" fill="#1f2328" font-weight="bold">Diferença</text>
<text x="1030" y="479" font-size="13" fill="#1f2328" font-weight="bold">Situação</text>
