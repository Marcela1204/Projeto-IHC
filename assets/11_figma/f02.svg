<text x="32" y="780" font-size="13" fill="#1f2328">• Em contrapartida: 2 ataques de força bruta do conjunto de teste deixariam de ser sinalizados</text>
<text x="32" y="804" font-size="13" fill="#1f2328">• Carga prevista do equipamento: 58% (hoje 62%) — abaixo do limite de operação</text>
