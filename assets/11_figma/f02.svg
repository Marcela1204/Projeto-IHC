<text x="44" y="508" font-size="13" fill="#1f2328" font-weight="bold">benigno</text>
<text x="170" y="508" font-size="13" fill="#1f2328" font-weight="bold">fpr ⓘ</text>
<text x="170" y="526" font-size="12" fill="#57606a">fração do benigno marcada como ataque; menor = menos alertas falsos</text>
<text x="560" y="508" font-size="13" fill="#1f2328">0,21</text>
<text x="680" y="508" font-size="13" fill="#1f2328" font-weight="bold">0,04</text>
<text x="800" y="508" font-size="13" fill="#1f2328">máx. 0,05</text>
<text x="880" y="508" font-size="13" fill="#1f2328">−0,17 (melhor)</text>
<text x="1030" y="508" font-size="13" fill="#1b5e20" font-weight="bold">✓ atende · decisivo</text>
<line x1="33" y1="534" x2="1167" y2="534" stroke="#eaeef2" stroke-width="1"/>
<text x="44" y="554" font-size="13" fill="#1f2328">brute_force</text>
